@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
body:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(11,20,48,.88),rgba(11,20,48,.55) 55%,rgba(11,20,48,.9));z-index:1}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.32),transparent 70%);animation:float 9s ease-in-out infinite;z-index:1}
.o1{width:360px;height:360px;right:-90px;top:-80px}.o2{width:260px;height:260px;left:-80px;bottom:-90px;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-26px) scale(1.07)}}
.wrap{position:relative;z-index:2;width:100%;max-width:420px;padding:20px;animation:up .8s both}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.card{background:rgba(13,20,42,.6);backdrop-filter:blur(14px);border:1px solid rgba(201,162,39,.3);border-radius:22px;padding:42px 36px 36px;box-shadow:0 30px 70px rgba(0,0,0,.45);text-align:center}
.mark{width:60px;height:60px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#8a6d1a);box-shadow:0 10px 26px rgba(201,162,39,.35)}
.mark svg{width:28px;height:28px;stroke:#14213d;fill:none;stroke-width:1.8}
.card h1{margin:0 0 6px;font-size:22px;letter-spacing:.4px}.card h1 span{color:var(--accent)}
.card p{margin:0 0 30px;color:#aab6d3;font-size:14px;line-height:1.6}
.field{position:relative;margin-bottom:8px}
.field input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);border-radius:12px;padding:16px 16px 16px 46px;color:#fff;font:600 17px/1 system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;transition:.25s}
.field input::placeholder{color:#7c87a6;letter-spacing:.5px;text-transform:none;font-weight:400}
.field input:focus{outline:0;border-color:var(--accent);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(201,162,39,.18)}
.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#8a96b8;fill:none;stroke-width:1.8;transition:stroke .25s}
.field input:focus~svg{stroke:var(--accent)}
.card.shake .field input{border-color:#e05c5c}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.shake .field{animation:shk .5s}
.err{min-height:20px;color:#ff9b9b;font-size:12.5px;margin:10px 0 2px;opacity:0;transition:opacity .2s}
.err.on{opacity:1}
button.go{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--accent),#e0bd52);color:#14213d;border:0;padding:15px;border-radius:12px;font:700 15px system-ui,sans-serif;letter-spacing:.4px;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:8px}
button.go:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(201,162,39,.4)}
button.go:active{transform:translateY(0)}
button.go[disabled]{opacity:.6;pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(20,33,61,.3);border-top-color:#14213d;animation:sp .7s linear infinite;display:none}
.go.loading .spin{display:inline-block}.go.loading .gt{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.lock{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#0b1430;opacity:0;pointer-events:none;transition:opacity .5s}
.lock.on{opacity:1;pointer-events:auto}
.lock .tick{width:92px;height:92px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:pop .6s both}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.lock svg{width:44px;height:44px;stroke:#14213d;stroke-width:3;fill:none;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .6s .4s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.foot{text-align:center;margin-top:22px;color:#7c87a6;font-size:12px;position:relative;z-index:2}
.foot a{color:#c9a227;text-decoration:none}
@media(max-width:420px){.card{padding:34px 24px 28px;border-radius:18px}}
</style>
</head>
<body>
<div class="herobg"></div><div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">
<div class="card" id="card">
<div class="mark"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/><circle cx="12" cy="16" r="1.6" fill="#14213d" stroke="none"/></svg></div>
<h1>POCKET<span>CAPITAL</span></h1>
<p>This area is for invited investors and partners only.<br>Enter your access code to continue.</p>
<form id="f" autocomplete="off">
<div class="field"><input id="code" type="text" placeholder="Access code" maxlength="20" inputmode="text"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div>
<div class="err" id="err">Incorrect code. Please try again.</div>
<button class="go" id="btn" type="submit"><span class="spin"></span><span class="gt">Enter site</span></button>
</form>
</div>
</div>
<div class="lock" id="lock"><div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-10"/></svg></div></div>
<script>
const CODE='#NTM234';
const f=document.getElementById('f'),card=document.getElementById('card'),err=document.getElementById('err'),btn=document.getElementById('btn'),inp=document.getElementById('code'),lock=document.getElementById('lock');
inp.focus();
f.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();
if(v.toUpperCase()===CODE.toUpperCase()){btn.classList.add('loading');btn.disabled=true;
setTimeout(()=>{lock.classList.add('on');setTimeout(()=>location.href='index.html',700)},500)}
else{err.classList.add('on');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');inp.value='';inp.focus()}};
</script>
</body>
</html>
